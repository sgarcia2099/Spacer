[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacer-ms"
version = "0.2.0"
description = "Single-group DDA chimericity assessment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Spacer contributors"}]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
spacer = "spacer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
